spring:
  application:
    name: forumhub

  datasource:
    url: jdbc:mysql://localhost:3306/forumhub_api?createDatabaseIfNotExist=true
    username: admin
    password: 123

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 900 # 5m
    refreshTokenExpiration: 604800 # 7d